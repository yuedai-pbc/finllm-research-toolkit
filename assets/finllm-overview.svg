<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="FinLLM Research Toolkit overview">
  <rect width="1100" height="420" fill="#fbfaf7"/>
  <rect x="40" y="36" width="1020" height="348" rx="18" fill="#ffffff" stroke="#ded8cf" stroke-width="2"/>
  <text x="70" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#20282c">FinLLM Research Toolkit</text>
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d686c">From survey work to reusable research infrastructure</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#20282c">
    <rect x="70" y="165" width="180" height="92" rx="12" fill="#f2eee7" stroke="#ded8cf"/>
    <text x="95" y="202" font-weight="700">Survey Papers</text>
    <text x="95" y="228" fill="#5d686c">Taxonomy and notes</text>
    <rect x="315" y="165" width="180" height="92" rx="12" fill="#f2eee7" stroke="#ded8cf"/>
    <text x="340" y="202" font-weight="700">Research Tasks</text>
    <text x="340" y="228" fill="#5d686c">Macro and finance</text>
    <rect x="560" y="165" width="180" height="92" rx="12" fill="#f2eee7" stroke="#ded8cf"/>
    <text x="585" y="202" font-weight="700">RAG Workflows</text>
    <text x="585" y="228" fill="#5d686c">Evidence grounding</text>
    <rect x="805" y="165" width="180" height="92" rx="12" fill="#f2eee7" stroke="#ded8cf"/>
    <text x="830" y="202" font-weight="700">Agent Systems</text>
    <text x="830" y="228" fill="#5d686c">Research automation</text>
  </g>
  <g stroke="#1f6f68" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M255 211 L305 211"/>
    <path d="M500 211 L550 211"/>
    <path d="M745 211 L795 211"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5d686c">
    <text x="92" y="316">Evaluation: accuracy, citation quality, reasoning transparency, risk awareness, reproducibility</text>
    <text x="92" y="346">Public release policy: public-source materials, synthetic examples, no restricted reports or proprietary data</text>
  </g>
